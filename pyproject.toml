# Layout follows the uv project guide: https://docs.astral.sh/uv/concepts/projects/init/
# and the hatchling src-layout docs: https://hatch.pypa.io/latest/config/build/
[project]
name = "study-graph-mcp"
version = "0.1.0"
description = "MCP server that turns lecture slides and readings into a searchable knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
study-graph-mcp = "study_graph.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
